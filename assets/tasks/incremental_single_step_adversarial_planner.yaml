# Single-step adversarial planner task
# Used by SingleStepVLMInstructionGenerator for adversarial experiments
# This task receives images + metadata and directly produces instructions

name: "Incremental Single-Step Adversarial Planner"
description: >
  Analyzes video frames and metadata to identify critical stress-test intervals
  and generate adversarial instructions that cause crashes.

system_prompt_path: "assets/prompts/incremental_independent_adversarial_planner_task.txt"

inputs:
  images: true
  metadata: true
  descriptions: false
  failure_text: false
  route_completion: false
  previously_tried_instructions: true

outputs:
  instruction: true     # TODO: instructionS
  descriptions: false
