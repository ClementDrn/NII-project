# Define jobs to run in this file.
# The following documentation describes version 2.0-dev of this file format.
# 
# Structure:
# - version: Version of this file's format
# - jobs: List of jobs to run
#
# Job properties:
# - name: A name to label the job
# - simulator: ID of the simulator config to use (defined in config.yaml)
# - scenarios: The scenarios to run (indices, names, or "all" for all scenarios)
# - ground_truth_count: Number of ground truth runs to perform (default: 1)
# - ground_truth_cache_dir: Directory to cache ground truth results (default: "", no caching)
# - filter: ID of the filter config to use (defined in config.yaml)
# - generator: ID of the generator config to use (defined in config.yaml)
# - model_instances: List of model instance IDs to use (defined in config.yaml)
# - experiment_nature: Nature of the experiment ("adversarial" or "corrective") (default: "adversarial")
# - instruction_generation_count: Number of instruction generations to perform (default: 1)
# - instruction_count_per_generation: Number of instructions to use per generation (should be <= generator's count)
#
# Example:
# ---
# version: "2.0-dev"
# jobs:
#   - name: "Small tests"
#     simulator: "carla_basic"
#     scenarios:
#       - 0
#       - 1
#       - 3
#     ground_truth_count: 1
#     ground_truth_cache_dir: "cache"
#     filter: "undersampled_filter"
#     generator: "gpt5_mini_single_step"
#     model_instances:
#       - "gpt5_mini_0"
#     experiment_nature: "adversarial"
#     instruction_generation_count: 1
#     instruction_count_per_generation: 3
---
version: "2.0-dev"
jobs:
  - name: "3-prompt single-step gpt-5-mini experiments"
    simulator: "carla_basic"
    # Simulator
    scenarios:
      - 0
      - 5
      - 8
      - 18
      - 20
      - 24
      - 36
      - 37
      - 40
      - 41
      - 44
      - 56
      - 63
      - 71
      - 73
      - 77
      - 79
      - 80
      - 100
      - 113
      - 120
      - 122
      - 133
      - 184
      - 193
    ground_truth_count: 1
    ground_truth_cache_dir: "cache"
    # Filter
    filter: "undersampled_filter"
    # Generator
    generator: "gpt-5-mini_single_step"
    model_instances:
      - "gpt-5-mini_0"
    experiment_nature: "adversarial"
    instruction_generation_count: 1   # how many times to generate instructions, in one iteration
    instruction_count_per_generation: 3
    repeat_count: 1   # will cause to loop the pipeline, possibly with context-aware generation after the first iteration
    stop_repeat_on_success: false
