# Configuration file for the project
# 
# - version: Version of this file's format
# - vlm: Vision-Language Model configuration (follows OpenAI chat completion API format)
# - carla: CARLA simulator configuration
# 
# VLM properties:
# - model: The VLM model to use (e.g., "r4b")
# - temperature (optional): Sampling temperature [0.0, 1.0]
# - max_tokens (optional): Maximum number of tokens to generate (strictly positive integer)
# - extra_body (optional): Additional parameters passed to the API
# 
# CARLA properties:
# - debug: Enable debug image output from SimLingo agent (true/false)
# 
# Note: Environment variables (VLM_HOST, VLM_API_KEY, CARLA_PATH, CONDA_PATH, OUTPUT_PATH)
#       must be set in a .env file at the root of the project.
# 
# Example:
# ---
# version: "1.0"
# vlm:
#   model: "r4b"
#   temperature: 0.7
#   max_tokens: 1024
#   extra_body:
#     chat_template_kwargs:
#       thinking_mode: "long"
# carla:
#   debug: true
---
version: "1.0"

vlm:
  model: "r4b"              # options: r4b
  temperature: 0.7          # [0.0, 1.0]
  max_tokens: 1024          # strictly positive integer
  extra_body:
    chat_template_kwargs:
      thinking_mode: "long"  # options for r4b: short (disabled), long (enabled), auto

carla:
  debug: true  # Enable debug image output from SimLingo agent (set to true to enable)
