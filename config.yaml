# Configuration file for the project
# TODO: Update documentation 
# 
# - version: Version of this file's format
# - vlm: Vision-Language Model configuration (follows OpenAI chat completion API format)
# - carla: CARLA simulator configuration
# 
# VLM properties:
# - model: The VLM model to use (e.g., "r4b")
# - temperature (optional): Sampling temperature [0.0, 1.0]
# - max_tokens (optional): Maximum number of tokens to generate (strictly positive integer)
# - extra_body (optional): Additional parameters passed to the API
# 
# CARLA properties:
# - debug: Enable debug image output from SimLingo agent (true/false)
# 
# Note: Environment variables (VLM_HOST, VLM_API_KEY, CARLA_PATH, CONDA_PATH, OUTPUT_PATH)
#       must be set in a .env file at the root of the project.
# 
# Example:
# ---
# version: "1.0"
# vlm:
#   model: "r4b"
#   temperature: 0.7
#   max_tokens: 1024
#   extra_body:
#     chat_template_kwargs:
#       thinking_mode: "long"
# carla:
#   debug: true
---
version: "2.0-dev"

# generator:
#   design: "single_step_vlm"
#   models:
#     - model: "r4b"              # options: r4b
#       temperature: 0.7          # [0.0, 1.0]
#       max_tokens: 1024          # strictly positive integer
#       extra_body:
#         chat_template_kwargs:
#           thinking_mode: "long"  # options for r4b: short (disabled), long (enabled), auto

filter:
  max_frames_per_minute: 60     # Number of frames per minute to retain before clustering (0 = keep all frames)
  clustering_threshold: 0.995   # Similarity threshold for clustering frames (0.0 - 1.0)
  max_cluster_count: 60         # Maximum number of clusters allowed, this is intended as a security measure, the clustering_threshold should be the main control for the number of clusters

generator:
  design: "multi_step_vlm"  # options: single_step_vlm, multi_step_vlm
  steps:
    # Description step
    - id: "description"
      model_name: "r4b"   # Authorized model
      temperature: 0.0
      max_tokens: 1024    # Output length limit. Should not be greater than: context window - prompt size
      thinking_mode: "disabled"   # options: "disabled", "enabled", "default"
    # Planning step
    # - id: "planning"
    #   model_name: "r4b"
    #   temperature: 0.7
    #   max_tokens: 16384
    #   thinking_mode: "enabled"
    # Planning step
    - id: "planning"
      model_name: "qwen3-4b-thinking"
      temperature: 0.7
      max_tokens: 81920
      thinking_mode: "enabled"

# All available model instances
model_instances:
  # High-performance local instance
  - id: "r4b_0"
    model_name: "r4b"   # Should match its step's model_name
    type: "vlm"
    priority: 1
    batch_size: 32
    step_ids:
      - "description"
    local_config:
      port: 8000
      gpu_id: 0
      is_parallel_to_simulator: false  # True means that we can run the VLM parallely with the simulator
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.95
      context_window: 8192  # Token capacity of this model instance, should not exceed the model's max context window
      max_num_seqs: 64
      enable_chunked_prefill: true
      enable_prefix_caching: false
      dtype: "bfloat16"
  # Local LLM
  - id: "qwen3_0"
    model_name: "qwen3-4b-thinking"
    type: "llm"
    priority: 1
    batch_size: 1
    step_ids:
      - "planning"
    local_config:
      port: 8000
      gpu_id: 0
      is_parallel_to_simulator: false  # True means that we can run the VLM parallely with the simulator
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.98
      context_window: 110000
      max_num_seqs: 1
      enable_chunked_prefill: true
      enable_prefix_caching: false
      dtype: "bfloat16"
  # Low-performance remote instance
  # - id: "r4b_1"
  #   model_name: "r4b"
  #   type: "vlm"
  #   priority: 2
  #   step_ids:
  #     - "description"
  #   remote_config:
  #     host_id: "v100_vlm"   # Defined in hosts.yaml


carla:
  debug: true  # Enable debug image output from SimLingo agent (set to true to enable)
  gpu_id: 0
