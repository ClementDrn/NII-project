# Configuration file for the project
# TODO: Update documentation 
# 
# - version: Version of this file's format
# - vlm: Vision-Language Model configuration (follows OpenAI chat completion API format)
# - carla: CARLA simulator configuration
# 
# VLM properties:
# - model: The VLM model to use (e.g., "r4b")
# - temperature (optional): Sampling temperature [0.0, 1.0]
# - max_tokens (optional): Maximum number of tokens to generate (strictly positive integer)
# - extra_body (optional): Additional parameters passed to the API
# 
# CARLA properties:
# - debug: Enable debug image output from SimLingo agent (true/false)
# 
# Note: Environment variables (VLM_HOST, VLM_API_KEY, CARLA_PATH, CONDA_PATH, OUTPUT_PATH)
#       must be set in a .env file at the root of the project.
# 
# Example:
# ---
# version: "1.0"
# vlm:
#   model: "r4b"
#   temperature: 0.7
#   max_tokens: 1024
#   extra_body:
#     chat_template_kwargs:
#       thinking_mode: "long"
# carla:
#   debug: true
---
version: "2.0-dev"

# generator:
#   design: "single_step_vlm"
#   models:
#     - model: "r4b"              # options: r4b
#       temperature: 0.7          # [0.0, 1.0]
#       max_tokens: 1024          # strictly positive integer
#       extra_body:
#         chat_template_kwargs:
#           thinking_mode: "long"  # options for r4b: short (disabled), long (enabled), auto

generator:
  design: "multi_step_vlm"  # options: single_step_vlm, multi_step_vlm
  steps:
    # Description step
    - id: "description"
      model_name: "r4b"
      temperature: 0.0
      max_tokens: 1024
      extra_body:
        chat_template_kwargs:
          thinking_mode: "short"
    # Planning step
    - id: "planning"
      model_name: "r4b"
      temperature: 0.7
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          thinking_mode: "long"

# All available model instances
model_instances:
  # High-performance local instance
  - id: "r4b_0"
    model_name: "r4b"
    type: "vlm"
    priority: 1
    batch_size: 32
    step_ids:
      - "description"
      - "planning"
    local_config:
      port: 8000
      gpu_id: 0
      is_parallel_to_simulator: false  # True means that we can run the VLM parallely with the simulator
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.95
      max_num_seqs: 64
      enable_chunked_prefill: true
      enable_prefix_caching: false
      dtype: "bfloat16"
  # Low-performance remote instance
  # - id: "r4b_1"
  #   model_name: "r4b"
  #   type: "vlm"
  #   priority: 2
  #   step_ids:
  #     - "description"
  #   remote_config:
  #     host_id: "v100_vlm"   # Defined in hosts.yaml

carla:
  debug: true  # Enable debug image output from SimLingo agent (set to true to enable)
  gpu_id: 0
