[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "untitled"
version = "0.0.0"
dependencies = [
    "colorlog",
    "openai",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "python-abc",
    "PyYAML",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]
