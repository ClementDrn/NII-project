[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digit"
version = "0.1.0"
dependencies = [
    "colorlog",
    "litellm",
    "litellm[proxy]",
    "anthropic",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "python-abc",
    "PyYAML",
    "torch",
    "torchvision",
    "transformers",
    "spacy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
analysis = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.10",
    "PyYAML>=6",
]
notebook = [
    "nbformat>=5",
    "nbclient>=0.10",
    "ipykernel>=6",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "lark"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--ignore=vendor"
