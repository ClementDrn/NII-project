[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digit"
version = "1.0.0"
description = "Driving Instruction Generation and Injection for Testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorlog",
    "litellm",
    "anthropic>=1.4,<2",
    "pillow",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "PyYAML",
    "torch",
    "torchvision",
    "transformers",
    "spacy>=3.8,<3.9",
    "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
analysis = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.10",
    "PyYAML>=6",
]
notebook = [
    "nbformat>=5",
    "nbclient>=0.10",
    "ipykernel>=6",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "lark"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--ignore=vendor"
asyncio_default_fixture_loop_scope = "function"
